# Light CI: syntax checks only. No secret, no deployment, no connection to the
# Homebridge server or to the devices.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the oldest Node.js that package.json accepts (engines)

      - name: JavaScript (node --check)
        run: |
          status=0
          while IFS= read -r -d '' f; do node --check "$f" || status=1; done < <(git ls-files -z -- '*.js' '*.mjs' '*.cjs')
          exit $status

      - name: JSON (json.tool)
        # The runner's own python3 is enough to parse JSON.
        run: |
          status=0
          while IFS= read -r -d '' f; do python3 -m json.tool "$f" > /dev/null || status=1; done < <(git ls-files -z -- '*.json')
          exit $status

# CI: checks (the steps below), then promotion: a green push on main fast-forwards the branch `production`,
# which the home server's deployer pulls and applies (the owner's choice of 03/11/2026: a green push goes to production).
# No secret, no connection to the server or the Mac. Agents read the result with `gh run list` and `gh run view`.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:   # a newer push cancels the run of an older one: `production` only moves forward
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # for the promotion only; the checks never use the token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the oldest Node.js that package.json accepts (engines)

      - name: JavaScript (node --check)
        run: |
          status=0
          while IFS= read -r -d '' f; do node --check "$f" || status=1; done < <(git ls-files -z -- '*.js' '*.mjs' '*.cjs')
          exit $status

      - name: JSON (json.tool)
        # The runner's own python3 is enough to parse JSON.
        run: |
          status=0
          while IFS= read -r -d '' f; do python3 -m json.tool "$f" > /dev/null || status=1; done < <(git ls-files -z -- '*.json')
          exit $status

      - name: Promote to production
        # Fast-forward only: GitHub refuses anything else, and the run turns red.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" -f sha="$GITHUB_SHA" -F force=false > /dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/production -f sha="$GITHUB_SHA" > /dev/null
